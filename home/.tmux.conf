# Terminal and responsiveness
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g focus-events on
set -sg escape-time 10
set -g history-limit 100000
set -g mouse on
set -g set-clipboard on

# Prefix and indexing
unbind C-b
set -g prefix C-a
bind C-a send-prefix
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Workflow defaults
set -g detach-on-destroy off
set -g repeat-time 300
set -g display-time 3000
set -g status-interval 5
set -g status-position top
set -g mode-keys vi
setw -g automatic-rename on
setw -g allow-rename off
setw -g aggressive-resize on
setw -g monitor-activity off
set -g visual-activity off

# Start windows and splits in the current pane's directory
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Fast reload
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"

# Vim-like pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Fast resizing
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Easier window navigation
bind -n M-h previous-window
bind -n M-l next-window

# Copy mode tuned for keyboard and mouse
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'wl-copy'

# Full-screen terminal dashboards in disposable popups
bind g display-popup -d "#{pane_current_path}" -w "95%" -h "95%" -E "lazygit"
bind B display-popup -d "#{pane_current_path}" -w "90%" -h "90%" -E "btop"
bind e display-popup -d "#{pane_current_path}" -w "95%" -h "95%" -E "nvim"
bind D display-popup -d "#{pane_current_path}" -w "90%" -h "90%" -E "ncdu ."
bind t display-popup -d "#{pane_current_path}" -w "90%" -h "90%" -E "$SHELL"

# Full-width background-matched theme with blue focus
set -g status-justify left
set -g message-style "fg=#e5e7eb,bg=#2b3036"
set -g mode-style "fg=#061526,bg=#60a5fa,bold"
set -g status-style "fg=#c9d1d9,bg=default"
set -g pane-border-style "fg=#1f242a"
set -g pane-active-border-style "fg=#3b82f6"
set -g clock-mode-colour "#3b82f6"

setw -g window-status-separator ""
setw -g window-status-style "fg=#7d8590,bg=default"
setw -g window-status-format "  #I:#W  "
setw -g window-status-current-style "fg=#e6edf3,bg=default,bold"
setw -g window-status-current-format "#[fg=#3b82f6,bg=default,bold] #I:#W#{?window_zoomed_flag, #[fg=#93c5fd]Z,}  "
setw -g window-status-activity-style "fg=#3b82f6,bg=default,bold"
setw -g window-status-bell-style "fg=#f0f6fc,bg=#da3633,bold"

set -g status-left-length 40
set -g status-right-length 120
set -g status-left "#[fg=#3b82f6,bg=default,bold] #S #{?client_prefix,#[fg=#061526]#[bg=#3b82f6]#[bold] prefix #[default],}"
set -g status-right "#[fg=#7d8590,bg=default]#{pane_current_path}#{?window_zoomed_flag, #[fg=#3b82f6]zoom,} #[fg=#30363d]│ #[fg=#c9d1d9]%Y-%m-%d %H:%M "

# Keep panes visually quiet.
set -g pane-border-status off
