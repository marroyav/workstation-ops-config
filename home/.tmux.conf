# Terminal and responsiveness
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g focus-events on
set -sg escape-time 10
set -g history-limit 100000
set -g mouse on
set -g set-clipboard on

# Prefix and indexing
unbind C-b
set -g prefix C-a
bind C-a send-prefix
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Workflow defaults
set -g detach-on-destroy off
set -g repeat-time 300
set -g display-time 3000
set -g status-interval 5
set -g status-position bottom
set -g mode-keys vi
setw -g automatic-rename on
setw -g allow-rename off
setw -g monitor-activity on
set -g visual-activity on

# Start windows and splits in the current pane's directory
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Fast reload
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"

# Vim-like pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Fast resizing
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Easier window navigation
bind -n M-h previous-window
bind -n M-l next-window

# Copy mode tuned for keyboard and mouse
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# Better visuals
set -g message-style "fg=#c0caf5,bg=#24283b"
set -g mode-style "fg=#1f2335,bg=#7aa2f7,bold"
set -g status-style "fg=#c0caf5,bg=#1a1b26"
set -g pane-border-style "fg=#414868"
set -g pane-active-border-style "fg=#7aa2f7"
set -g clock-mode-colour "#7aa2f7"

setw -g window-status-style "fg=#7f849c,bg=#1a1b26"
setw -g window-status-format " #I:#W "
setw -g window-status-current-style "fg=#1a1b26,bg=#7aa2f7,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-activity-style "fg=#e0af68,bg=#1a1b26,bold"
setw -g window-status-bell-style "fg=#1a1b26,bg=#f7768e,bold"

set -g status-left-length 60
set -g status-right-length 100
set -g status-left "#{?client_prefix,#[fg=#1a1b26]#[bg=#f7768e]#[bold] PREFIX #[default],}#[fg=#1a1b26,bg=#9ece6a,bold] #S #[fg=#9ece6a,bg=#1a1b26,nobold]> "
set -g status-right "#[fg=#7f849c,bg=#1a1b26]#{?window_zoomed_flag,[zoom] ,}#(basename '#{pane_current_path}') #[fg=#7aa2f7]| #[fg=#c0caf5]%Y-%m-%d %H:%M "

# Cleaner pane titles
set -g pane-border-status bottom
set -g pane-border-format " #[fg=#7f849c]#P #[fg=#c0caf5]#{pane_current_command} "
