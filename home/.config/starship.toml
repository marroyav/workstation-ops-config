add_newline = false
command_timeout = 1000
format = "$username$hostname$directory$git_branch$git_status$python$nodejs$rust$cmd_duration$character"

[character]
success_symbol = "[❯](bold blue)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[directory]
style = "bold cyan"
truncation_length = 4
truncate_to_repo = false
read_only = " ro"

[git_branch]
symbol = "git:"
style = "bold purple"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold yellow"

[cmd_duration]
min_time = 1000
format = "[took $duration](dimmed yellow) "

[python]
symbol = "py "

[nodejs]
symbol = "node "

[rust]
symbol = "rs "
